<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seller Dashboard - ផ្ទាំងគ្រប់គ្រងហាង</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Siemreap&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Khmer OS Siemreap', 'Siemreap', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }

        input,
        select,
        textarea,
        button {
            font-family: 'Khmer OS Siemreap', 'Siemreap', sans-serif !important;
        }
    </style>
</head>

<body class="p-3 sm:p-6 max-w-6xl mx-auto bg-gray-50 text-gray-800 antialiased min-h-screen">

    <!-- Header & Link ហាងផ្ទាល់ខ្លួន -->
    <header class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 mb-5">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
                <h1 class="text-lg sm:text-2xl font-black text-indigo-600 tracking-tight" id="dash-store-name">
                    ផ្ទាំងគ្រប់គ្រងហាង</h1>
                <p class="text-xs text-gray-500">គ្រប់គ្រងផលិតផល និងការបញ្ជាទិញរបស់ហាងអ្នក</p>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="copyMyStoreLink()"
                    class="flex-1 sm:flex-none bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3.5 py-2 rounded-xl text-xs border border-emerald-200 transition flex items-center justify-center gap-1.5 shadow-sm">
                    <span>🔗</span>
                    <span>Copy Link ហាងផ្ញើឱ្យភ្ញៀវ</span>
                </button>
                <a href="/"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-3 py-2 rounded-xl text-xs transition">
                    &larr; ទៅទំព័រដើម
                </a>
            </div>
        </div>

        <!-- បង្ហាញ Link ផ្ទាល់ខ្លួន -->
        <div
            class="mt-3 pt-3 border-t flex items-center justify-between bg-indigo-50/50 p-2.5 rounded-xl border border-indigo-100">
            <span class="text-xs text-indigo-900">
                Link ហាងរបស់អ្នក៖ <b id="my-store-url" class="font-mono text-indigo-600 underline"></b>
            </span>
            <span class="text-[10px] bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded font-bold">Active</span>
        </div>
    </header>

    <!-- ១. ផ្នែក Upload KHQR របស់ហាង -->
    <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 mb-5">
        <h2 class="font-bold text-sm sm:text-base text-gray-900 mb-0.5">💳 កុងធនាគារ KHQR របស់ហាង</h2>
        <p class="text-xs text-gray-500 mb-3">Upload KHQR ផ្ទាល់ខ្លួន ដើម្បីឱ្យភ្ញៀវស្កេនបាញ់លុយចូលកុងអ្នក</p>

        <form id="qr-form" class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">
            <input type="file" id="qrImageFile" accept="image/*" required
                class="text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border rounded-xl p-1 bg-white">
            <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm">
                រក្សាទុក KHQR
            </button>
        </form>
    </section>

    <!-- ២. ផ្នែកដាក់លក់ផលិតផលថ្មី -->
    <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 mb-5">
        <h2 class="font-bold text-sm sm:text-base text-gray-900 mb-1">📦 បញ្ចូលផលិតផលដាក់លក់</h2>
        <form id="prod-form" class="space-y-3 mt-3">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-gray-700 mb-1">ឈ្មោះផលិតផល</label>
                    <input id="p-title" required placeholder="ឧ. អាវខូវប៊យដៃវែង"
                        class="w-full border p-2 rounded-xl text-xs bg-white outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">តម្លៃ ($)</label>
                    <input id="p-price" type="number" step="0.01" required placeholder="18.00"
                        class="w-full border p-2 rounded-xl text-xs bg-white outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ទំហំក្នុងស្តុក (Sizes)</label>
                    <input id="p-sizes" required placeholder="S, M, L, XL" value="S, M, L, XL"
                        class="w-full border p-2 rounded-xl text-xs bg-white outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">រូបភាពផលិតផល</label>
                    <input id="p-img" type="file" accept="image/*" required onchange="previewProdImg(event)"
                        class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-700 border rounded-xl p-1 bg-white">
                </div>
            </div>

            <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition shadow-sm">
                + ដាក់លក់ទំនិញ
            </button>
        </form>
    </section>

    <!-- ៣. បញ្ជីផលិតផលក្នុងហាង -->
    <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 mb-5">
        <h2 class="font-bold text-sm sm:text-base text-gray-900 mb-3">📊 ផលិតផលក្នុងហាងរបស់អ្នក</h2>
        <div id="product-list" class="space-y-2.5"></div>
    </section>

    <!-- ៤. ផ្នែក Order ការបញ្ជាទិញពីភ្ញៀវ -->
    <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100">
        <h2 class="font-bold text-sm sm:text-base text-gray-900 mb-3">🔔 ការបញ្ជាទិញពីអតិថិជន (Orders)</h2>
        <div id="order-list" class="space-y-3"></div>
    </section>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let storeSlug = urlParams.get('store') || localStorage.getItem('km_my_store_slug') || 'default';
        let base64ProdImg = '';

        async function initDashboard() {
            const storeUrl = `${window.location.origin}/shop/${storeSlug}`;
            document.getElementById('my-store-url').innerText = storeUrl;

            try {
                const res = await fetch(`/api/store/get/${storeSlug}`);
                if (res.ok) {
                    const store = await res.json();
                    document.getElementById('dash-store-name').innerText = store.name;
                }
            } catch (e) { }

            loadProducts();
            loadOrders();
        }

        function copyMyStoreLink() {
            const link = `${window.location.origin}/shop/${storeSlug}`;
            navigator.clipboard.writeText(link);
            alert(`✓ បានចម្លង Link ហាងរបស់អ្នកជោគជ័យ!\n${link}\nអ្នកអាចផ្ញើទៅកាន់ភ្ញៀវបានភ្លាម!`);
        }

        function previewProdImg(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => { base64ProdImg = ev.target.result; };
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('prod-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!base64ProdImg) return alert('សូមជ្រើសរើសរូបភាពផលិតផល!');

            const payload = {
                store_slug: storeSlug,
                title: document.getElementById('p-title').value.trim(),
                price: document.getElementById('p-price').value,
                sizes: document.getElementById('p-sizes').value.trim(),
                imageBase64: base64ProdImg
            };

            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('✓ ដាក់លក់ផលិតផលជោគជ័យ!');
                document.getElementById('prod-form').reset();
                base64ProdImg = '';
                loadProducts();
            }
        };

        async function loadProducts() {
            const res = await fetch(`/api/products?slug=${storeSlug}`);
            const prods = await res.json();
            const container = document.getElementById('product-list');

            if (!prods.length) {
                container.innerHTML = '<div class="text-xs text-gray-400 text-center py-4">មិនទាន់មានផលិតផលនៅឡើយទេ</div>';
                return;
            }

            container.innerHTML = prods.map(p => `
                <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl border">
                    <div class="flex items-center gap-3">
                        <img src="${p.image}" class="w-12 h-12 object-cover rounded-lg border bg-white">
                        <div>
                            <h4 class="font-bold text-xs text-gray-900">${p.title}</h4>
                            <span class="text-[11px] text-indigo-600 font-bold">$${Number(p.price).toFixed(2)}</span>
                            <span class="text-[10px] text-gray-400 ml-2">Size: ${p.attributes?.size}</span>
                        </div>
                    </div>
                    <button onclick="deleteProd('${p.id}')" class="text-xs text-red-500 hover:text-red-700 bg-red-50 px-2.5 py-1 rounded-lg font-bold">លុប</button>
                </div>
            `).join('');
        }

        async function deleteProd(id) {
            if (!confirm('តើអ្នកចង់លុបទំនិញនេះមែនទេ?')) return;
            await fetch(`/api/products/${id}`, { method: 'DELETE' });
            loadProducts();
        }

        document.getElementById('qr-form').onsubmit = async (e) => {
            e.preventDefault();
            const file = document.getElementById('qrImageFile').files[0];
            const fd = new FormData();
            fd.append('qrImageFile', file);
            fd.append('slug', storeSlug);

            const res = await fetch('/api/vendor/khqr', { method: 'POST', body: fd });
            if (res.ok) alert('✓ បាន Upload KHQR របស់ហាងជោគជ័យ!');
        };

        async function loadOrders() {
            const res = await fetch(`/api/admin/orders?slug=${storeSlug}`);
            const orders = await res.json();
            const container = document.getElementById('order-list');

            if (!orders.length) {
                container.innerHTML = '<div class="text-xs text-gray-400 text-center py-6 bg-gray-50 rounded-xl border">មិនទាន់មានការបញ្ជាទិញនៅឡើយទេ</div>';
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="p-3.5 bg-gray-50 rounded-xl border text-xs">
                    <div class="flex justify-between items-center pb-2 mb-2 border-b">
                        <span class="font-mono text-gray-500">${o.tranId}</span>
                        <span class="font-bold ${o.status === 'PAID' ? 'text-green-600' : (o.status === 'REJECTED' ? 'text-red-600' : 'text-amber-600')}">
                            ${o.status === 'PAID' ? '✓ បង់រួច' : (o.status === 'REJECTED' ? '✕ បដិសេធ' : '⏳ រង់ចាំពិនិត្យ')}
                        </span>
                    </div>
                    <div class="flex justify-between">
                        <div>
                            <div class="font-bold text-gray-900">${o.customerName} (${o.phone})</div>
                            <div class="text-[11px] text-gray-500">📍 ${o.address}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-black text-indigo-600 text-sm">$${o.amount}</div>
                            ${o.slipImage ? `<a href="${o.slipImage}" target="_blank" class="text-[10px] text-indigo-600 underline font-bold">មើល Slip</a>` : ''}
                        </div>
                    </div>
                    ${o.status === 'PENDING' ? `
                        <div class="flex gap-2 mt-2 pt-2 border-t">
                            <button onclick="confirmOrder('${o.tranId}')" class="w-1/2 py-1.5 bg-emerald-600 text-white rounded-lg font-bold text-xs">✓ យល់ព្រម</button>
                            <button onclick="rejectOrder('${o.tranId}')" class="w-1/2 py-1.5 bg-red-50 text-red-600 border border-red-200 rounded-lg font-bold text-xs">✕ បដិសេធ</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function confirmOrder(tranId) {
            await fetch('/api/admin/orders/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tranId })
            });
            loadOrders();
        }

        async function rejectOrder(tranId) {
            const reason = prompt('សរសេរមូលហេតុបដិសេធ:', 'មិនទាន់ឃើញលុយចូលកុងទេ');
            if (!reason) return;
            await fetch('/api/admin/orders/reject', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tranId, reason })
            });
            loadOrders();
        }

        initDashboard();
        setInterval(loadOrders, 4000);
    </script>
</body>

</html>

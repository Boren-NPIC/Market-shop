<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <title>កន្ត្រកទំនិញ - Khmer Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-6 max-w-3xl mx-auto bg-gray-50 text-gray-800">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">🛒 កន្ត្រកទំនិញរបស់អ្នក</h1>
        <a href="/" class="text-indigo-600 font-semibold text-sm">&larr; បន្តទិញទំនិញ</a>
    </div>

    <div id="cart-container" class="bg-white p-5 rounded-xl shadow-sm border mb-4">
        <div id="cart-list" class="space-y-3"></div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border flex justify-between items-center">
        <div>
            <span class="text-sm text-gray-500">តម្លៃសរុបទាំងអស់:</span>
            <p class="text-2xl font-black text-indigo-600">$<span id="total-price">0.00</span></p>
        </div>
        <div class="flex gap-3">
            <button onclick="emptyCart()"
                class="px-4 py-2 border border-red-300 text-red-600 rounded-lg text-sm font-semibold hover:bg-red-50">សម្អាតកន្ត្រក</button>
            <a href="/checkout.html"
                class="px-6 py-2 bg-green-600 text-white rounded-lg text-sm font-bold hover:bg-green-700">បន្តទៅទូទាត់</a>
        </div>
    </div>

    <script>
        const CART_KEY = 'km_market_cart';

        function getCart() {
            return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        }

        function renderCart() {
            const items = getCart();
            const listEl = document.getElementById('cart-list');
            const totalEl = document.getElementById('total-price');

            if (!items.length) {
                listEl.innerHTML = '<p class="text-gray-400 text-center py-6">កន្ត្រកទំនិញរបស់អ្នកនៅទទេស្អាត!</p>';
                totalEl.innerText = '0.00';
                return;
            }

            let total = 0;
            listEl.innerHTML = items.map((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                return `
          <div class="flex items-center justify-between border-b pb-3">
            <div class="flex items-center gap-3">
              <img src="${item.image || 'https://via.placeholder.com/80'}" class="w-14 h-14 object-cover rounded-lg border">
              <div>
                <h3 class="font-bold text-gray-800 text-sm">${item.title}</h3>
                <p class="text-xs text-gray-500">$${Number(item.price).toFixed(2)} x ${item.qty}</p>
              </div>
            </div>
            <div class="flex items-center gap-4">
              <span class="font-bold text-gray-800">$${itemTotal.toFixed(2)}</span>
              <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 text-xs font-semibold">លុប</button>
            </div>
          </div>
        `;
            }).join('');

            totalEl.innerText = total.toFixed(2);
        }

        function removeItem(index) {
            const items = getCart();
            items.splice(index, 1);
            localStorage.setItem(CART_KEY, JSON.stringify(items));
            renderCart();
        }

        function emptyCart() {
            localStorage.removeItem(CART_KEY);
            renderCart();
        }

        renderCart();
    </script>
</body>

</html>

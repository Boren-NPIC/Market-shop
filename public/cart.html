<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="cart-page-title">កន្ត្រកទំនិញ</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Kantumruy Pro & Siemreap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@600;700;800&family=Siemreap&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Khmer OS Siemreap', 'Siemreap', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }

        h1,
        h2,
        h3,
        h4,
        b {
            font-family: 'Kantumruy Pro', 'Siemreap', sans-serif !important;
        }

        p,
        span,
        button,
        a {
            line-height: 1.6;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-[#f8f9ff] via-[#f1f4fe] to-[#fbf7ff] text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- ============================================================= -->
    <!-- HEADER: AUTO ឈ្មោះ និង LOGO តាមហាងដែលភ្ញៀវកំពុងទិញ -->
    <!-- ============================================================= -->
    <header
        class="sticky top-0 z-30 bg-white/90 backdrop-blur-xl border-b border-indigo-100 shadow-[0_4px_25px_-5px_rgba(99,102,241,0.1)]">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">

            <!-- Logo & ឈ្មោះហាង (Auto ប្តូរតាមហាង) -->
            <a id="back-to-shop-link-logo" href="/" class="flex items-center gap-2.5 group select-none">
                <div id="cart-logo-box"
                    class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500/20 to-purple-500/20 border border-indigo-100 flex items-center justify-center text-xl overflow-hidden group-hover:scale-105 transition-transform shadow-xs">
                    <span id="cart-logo-emoji">🛍️</span>
                    <img id="cart-logo-img" src="" class="w-full h-full object-cover hidden">
                </div>
                <div>
                    <span id="cart-store-name"
                        class="text-base sm:text-lg font-black bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 bg-clip-text text-transparent tracking-tight block">
                        កំពុងទាញយក...
                    </span>
                    <span class="text-[9px] text-indigo-500 font-bold uppercase tracking-widest block -mt-0.5">ONLINE
                        STORE</span>
                </div>
            </a>

            <!-- ប៊ូតុងបន្តទិញទំនិញ (Auto Link ទៅកាន់ហាងវិញ) -->
            <a id="btn-continue-shopping" href="/"
                class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold px-3.5 py-2 rounded-xl border border-indigo-200 transition active:scale-95 flex items-center gap-1">
                <span>&larr;</span>
                <span>បន្តទិញទំនិញ</span>
            </a>
        </div>
    </header>

    <!-- MAIN CART CONTENT -->
    <main class="max-w-3xl mx-auto px-4 py-6 flex-1 w-full">

        <!-- Header កន្ត្រក -->
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-base sm:text-lg font-black text-gray-900 flex items-center gap-2">
                <span>🛒</span> <span>កន្ត្រកទំនិញរបស់អ្នក</span>
            </h1>
            <button onclick="clearAllCart()" class="text-xs text-red-500 hover:text-red-700 font-bold hover:underline">
                សម្អាតទាំងអស់
            </button>
        </div>

        <!-- បញ្ជីទំនិញក្នុងកន្ត្រក -->
        <div id="cart-items-container" class="space-y-3 mb-6"></div>

        <!-- សង្ខេបតម្លៃ & ប៊ូតុង Checkout -->
        <div id="cart-summary-box" class="bg-white p-5 rounded-3xl border border-indigo-100 shadow-sm hidden">
            <div class="flex justify-between items-center pb-4 border-b border-gray-100">
                <span class="text-sm font-bold text-gray-600">តម្លៃសរុបទាំងអស់៖</span>
                <span id="cart-total-price"
                    class="text-xl sm:text-2xl font-black text-indigo-600 tracking-tight">$0.00</span>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-4">
                <button onclick="clearAllCart()"
                    class="w-full py-3 bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs rounded-2xl transition">
                    សម្អាតកន្ត្រក
                </button>
                <button onclick="proceedToCheckout()"
                    class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold text-xs sm:text-sm rounded-2xl shadow-lg shadow-emerald-200 transition active:scale-95">
                    បន្តទៅទូទាត់ &rarr;
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-5 text-center text-xs text-gray-400 border-t border-indigo-50">
        © 2026 <span id="footer-store-name">SMD Market</span>. រក្សាសិទ្ធិគ្រប់យ៉ាង។
    </footer>

    <script>
        const CART_KEY = 'km_market_cart';
        let cartItems = [];
        let currentShopSlug = '';

        async function initCartPage() {
            try {
                cartItems = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            } catch (e) {
                cartItems = [];
            }

            // រកមើល store_slug ពីទំនិញដែលមានក្នុងកន្ត្រក
            if (cartItems.length > 0 && cartItems[0].store_slug && cartItems[0].store_slug !== 'default') {
                currentShopSlug = cartItems[0].store_slug;
            } else {
                // បើគ្មានក្នុងកន្ត្រក សាកល្បងយកពី URL query ឬ localStorage
                const urlParams = new URLSearchParams(window.location.search);
                currentShopSlug = urlParams.get('store') || localStorage.getItem('km_current_view_store') || '';
            }

            await loadStoreBranding(currentShopSlug);
            renderCartItems();
        }

        // Auto ទាញយកឈ្មោះហាង និង Logo ពិតប្រាកដ
        async function loadStoreBranding(slug) {
            const defaultName = "SMD Market";
            const shopUrl = slug ? `/shop/${slug}` : '/';

            // កំណត់ Link ត្រឡប់ទៅហាងវិញ
            document.getElementById('back-to-shop-link-logo').href = shopUrl;
            document.getElementById('btn-continue-shopping').href = shopUrl;

            if (!slug) {
                applyBrandingUI(defaultName, '');
                return;
            }

            try {
                const res = await fetch(`/api/store/get/${slug}`);
                if (res.ok) {
                    const store = await res.json();
                    applyBrandingUI(store.name, store.logo);
                } else {
                    applyBrandingUI(defaultName, '');
                }
            } catch (err) {
                applyBrandingUI(defaultName, '');
            }
        }

        function applyBrandingUI(name, logo) {
            document.getElementById('cart-store-name').innerText = name;
            document.getElementById('cart-page-title').innerText = `${name} - កន្ត្រកទំនិញ`;
            document.getElementById('footer-store-name').innerText = name;

            if (logo) {
                document.getElementById('cart-logo-img').src = logo;
                document.getElementById('cart-logo-img').classList.remove('hidden');
                document.getElementById('cart-logo-emoji').classList.add('hidden');
            } else {
                document.getElementById('cart-logo-img').classList.add('hidden');
                document.getElementById('cart-logo-emoji').classList.remove('hidden');
            }
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const summaryBox = document.getElementById('cart-summary-box');

            if (!cartItems.length) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-8 text-center border border-indigo-100 shadow-xs">
                        <div class="text-4xl mb-3">🛍️</div>
                        <h3 class="font-bold text-gray-800 text-sm mb-1">កន្ត្រកទំនិញរបស់អ្នកនៅទទេ</h3>
                        <p class="text-xs text-gray-400 mb-4">មិនទាន់មានទំនិញណាមួយត្រូវបានជ្រើសរើសនៅឡើយទេ</p>
                        <a href="${currentShopSlug ? `/shop/${currentShopSlug}` : '/'}" 
                           class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-md shadow-indigo-200 transition">
                            &larr; ទៅកាន់ហាងទិញទំនិញ
                        </a>
                    </div>
                `;
                summaryBox.classList.add('hidden');
                return;
            }

            let total = 0;
            container.innerHTML = cartItems.map((it, idx) => {
                const price = parseFloat(it.price || 0);
                const qty = parseInt(it.qty || 1);
                const subtotal = price * qty;
                total += subtotal;

                const size = (it.attributes && it.attributes.size) ? it.attributes.size : 'Standard';
                const img = it.image || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=200';

                return `
                    <div class="bg-white p-4 rounded-3xl border border-indigo-100 flex items-center justify-between gap-3 shadow-xs">
                        <div class="flex items-center gap-3 min-w-0">
                            <img src="${img}" class="w-16 h-16 object-cover rounded-2xl border border-indigo-50 bg-gray-50 flex-shrink-0">
                            <div class="min-w-0">
                                <h4 class="font-bold text-xs sm:text-sm text-gray-900 truncate">${it.title}</h4>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="text-xs font-black text-indigo-600">$${price.toFixed(2)}</span>
                                    <span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full font-bold border border-indigo-100">
                                        Size: ${size}
                                    </span>
                                </div>
                                <div class="flex items-center gap-2 mt-2">
                                    <button onclick="changeCartQty(${idx}, -1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded-lg text-xs font-bold text-gray-700 transition flex items-center justify-center">-</button>
                                    <span class="text-xs font-black text-gray-800 w-6 text-center">${qty}</span>
                                    <button onclick="changeCartQty(${idx}, 1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded-lg text-xs font-bold text-gray-700 transition flex items-center justify-center">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="text-right flex-shrink-0">
                            <div class="font-black text-indigo-600 text-sm sm:text-base">$${subtotal.toFixed(2)}</div>
                            <button onclick="removeCartItem(${idx})" class="text-[11px] text-red-500 hover:text-red-700 font-bold mt-2 hover:underline">
                                លុប
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cart-total-price').innerText = '$' + total.toFixed(2);
            summaryBox.classList.remove('hidden');
        }

        function changeCartQty(idx, delta) {
            cartItems[idx].qty = (cartItems[idx].qty || 1) + delta;
            if (cartItems[idx].qty < 1) cartItems[idx].qty = 1;
            localStorage.setItem(CART_KEY, JSON.stringify(cartItems));
            renderCartItems();
        }

        function removeCartItem(idx) {
            cartItems.splice(idx, 1);
            localStorage.setItem(CART_KEY, JSON.stringify(cartItems));
            renderCartItems();
        }

        function clearAllCart() {
            if (confirm('តើអ្នកចង់សម្អាតទំនិញទាំងអស់ក្នុងកន្ត្រកមែនទេ?')) {
                cartItems = [];
                localStorage.removeItem(CART_KEY);
                renderCartItems();
            }
        }

        function proceedToCheckout() {
            const redirectUrl = currentShopSlug ? `/checkout.html?store=${currentShopSlug}` : '/checkout.html';
            window.location.href = redirectUrl;
        }

        initCartPage();
    </script>
</body>

</html>

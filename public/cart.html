<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <!-- បន្ទាត់កូដសំខាន់បំផុតដើម្បីកុំឱ្យទូរស័ព្ទ Zoom តូច -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>កន្ត្រកទំនិញរបស់អ្នក - KM-Market</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font Siemreap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Siemreap&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Khmer OS Siemreap', 'Siemreap', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }

        input,
        select,
        textarea,
        button {
            font-family: 'Khmer OS Siemreap', 'Siemreap', sans-serif !important;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b sticky top-0 z-30">
        <div class="max-w-2xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2">
                <span class="text-2xl">🛍️</span>
                <span class="text-lg font-black text-indigo-600 tracking-tight">KM-Market</span>
            </a>
            <a href="/"
                class="text-xs font-bold text-indigo-600 hover:text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                <span>&larr; បន្តទិញទំនិញ</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto px-4 py-5 flex-1 w-full">
        <!-- Title Box -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2">
                <span class="text-xl">🛒</span>
                <h1 class="text-lg font-bold text-gray-900">កន្ត្រកទំនិញរបស់អ្នក</h1>
            </div>
            <button onclick="clearCart()" id="btn-clear-top"
                class="text-xs text-red-500 hover:text-red-700 font-semibold transition hidden">
                សម្អាតទាំងអស់
            </button>
        </div>

        <!-- បញ្ជីទំនិញក្នុងកន្ត្រក -->
        <div id="cart-container" class="space-y-3 mb-6"></div>

        <!-- ផ្ទាំងគណនាតម្លៃ និងប៊ូតុង Checkout -->
        <div id="checkout-section" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 hidden">
            <div class="flex justify-between items-center pb-3 mb-3 border-b">
                <span class="text-sm font-semibold text-gray-600">តម្លៃសរុបទាំងអស់៖</span>
                <span class="text-2xl font-black text-indigo-600 tracking-tight" id="cart-total">$0.00</span>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="clearCart()"
                    class="w-full py-3 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl text-xs sm:text-sm transition border border-red-100">
                    សម្អាតកន្ត្រក
                </button>
                <a href="/checkout.html"
                    class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs sm:text-sm transition shadow flex items-center justify-center gap-1">
                    បន្តទៅទូទាត់ &rarr;
                </a>
            </div>
        </div>
    </main>

    <script>
        const CART_KEY = 'km_market_cart';

        function getCart() {
            try {
                return JSON.parse(localStorage.getItem(CART_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cart-container');
            const checkoutSec = document.getElementById('checkout-section');
            const clearTop = document.getElementById('btn-clear-top');

            if (!cart || !cart.length) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-gray-100 shadow-sm my-6">
                        <div class="w-16 h-16 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                            🛒
                        </div>
                        <h3 class="font-bold text-base text-gray-800 mb-1">កន្ត្រកទំនិញនៅទទេ</h3>
                        <p class="text-xs text-gray-400 mb-5">អ្នកមិនទាន់បានជ្រើសរើសទំនិញណាមួយចូលកន្ត្រកនៅឡើយទេ</p>
                        <a href="/" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl transition shadow">
                            ទៅមើលទំនិញក្នុងហាង
                        </a>
                    </div>
                `;
                checkoutSec.classList.add('hidden');
                clearTop.classList.add('hidden');
                return;
            }

            checkoutSec.classList.remove('hidden');
            clearTop.classList.remove('hidden');

            let total = 0;

            container.innerHTML = cart.map((item, index) => {
                const price = parseFloat(item.price || 0);
                const qty = parseInt(item.qty || 1);
                const itemTotal = price * qty;
                total += itemTotal;

                const attr = item.attributes || {};
                let sizeLabel = attr.size || attr.shoe_size || '';

                return `
                    <div class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-gray-100 flex gap-3 sm:gap-4 items-center">
                        <!-- រូបភាពទំនិញ -->
                        <img src="${item.image || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=200'}" 
                             alt="${item.title}" 
                             class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-xl border border-gray-100 flex-shrink-0 bg-gray-50">

                        <!-- ព័ត៌មានទំនិញ -->
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-sm text-gray-900 truncate">${item.title || 'គ្មានឈ្មោះ'}</h3>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="text-xs text-indigo-600 font-bold">$${price.toFixed(2)}</span>
                                ${sizeLabel ? `<span class="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-1.5 py-0.5 rounded">Size: ${sizeLabel}</span>` : ''}
                            </div>

                            <!-- ប៊ូតុងបន្ថែមបន្ថយចំនួន -->
                            <div class="flex items-center gap-2 mt-2">
                                <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden bg-gray-50">
                                    <button onclick="updateQty(${index}, -1)" class="w-7 h-7 flex items-center justify-center text-xs font-bold text-gray-600 hover:bg-gray-200 transition">-</button>
                                    <span class="w-8 text-center text-xs font-bold text-gray-800">${qty}</span>
                                    <button onclick="updateQty(${index}, 1)" class="w-7 h-7 flex items-center justify-center text-xs font-bold text-gray-600 hover:bg-gray-200 transition">+</button>
                                </div>
                            </div>
                        </div>

                        <!-- តម្លៃសរុប និងប៊ូតុងលុប -->
                        <div class="text-right flex flex-col justify-between items-end h-16 sm:h-20 py-0.5">
                            <span class="font-black text-sm text-gray-900">$${itemTotal.toFixed(2)}</span>
                            <button onclick="removeItem(${index})" class="text-xs text-red-500 hover:text-red-700 font-semibold bg-red-50 hover:bg-red-100 px-2 py-1 rounded-md transition">
                                លុប
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cart-total').innerText = '$' + total.toFixed(2);
        }

        function updateQty(index, change) {
            let cart = getCart();
            if (!cart[index]) return;

            cart[index].qty = (cart[index].qty || 1) + change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            saveCart(cart);
        }

        function removeItem(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
        }

        function clearCart() {
            if (!confirm('តើអ្នកពិតជាចង់លុបទំនិញទាំងអស់ចេញពីកន្ត្រកមែនទេ?')) return;
            localStorage.removeItem(CART_KEY);
            renderCart();
        }

        // ចាប់ផ្តើមបង្ហាញកន្ត្រក
        renderCart();
    </script>
</body>

</html>
